services:
  - type: web
    name: triple-elite-vip-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn dashboard:app --bind 0.0.0.0:10000 --timeout 240 --graceful-timeout 240
    # Disque persistant pour triple_elite.db (historique matchs/equipes) :
    # sans lui, ce fichier vit sur le disque EPHEMERE du service et repart de
    # zero a chaque deploiement. ATTENTION : ce service a ete cree depuis le
    # Dashboard Render (pas via ce Blueprint), donc ce bloc ne s'applique PAS
    # tout seul ici (meme constat que pour startCommand ci-dessus) -- le
    # disque doit etre ajoute a la main dans Dashboard Render > ce service >
    # Disks, avec le meme mountPath. Conserve ici pour documenter la config
    # cible et pour un futur service recree via Blueprint.
    disk:
      name: triple-elite-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # sync: false = valeur saisie une seule fois dans le Dashboard Render
      # (Environment), jamais stockee dans ce fichier ni dans Git.
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SPORTSDB_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      # Doit correspondre au mountPath du disque ci-dessus. Meme mise en
      # garde : a ajouter a la main dans Dashboard Render > Environment.
      - key: DATA_DIR
        value: /var/data

  - type: web
    name: triple-elite-vip-paiement
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn paiement:app --bind 0.0.0.0:10001 --timeout 60
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LICENSE_SECRET_KEY
        sync: false
      - key: PAYDUNYA_MASTER_KEY
        sync: false
      - key: PAYDUNYA_PRIVATE_KEY
        sync: false
      - key: PAYDUNYA_TOKEN
        sync: false
      - key: GMAIL_EMAIL
        sync: false
      - key: GMAIL_MDP
        sync: false
      - key: PAIEMENT_BASE_URL
        sync: false
